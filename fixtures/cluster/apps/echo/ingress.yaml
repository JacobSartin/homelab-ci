---
# ${BASE_DOMAIN} is a Flux postBuild variable that only the live cluster
# provides; the schema step substitutes it before validation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: echo
spec:
  rules:
    - host: echo.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 8080
