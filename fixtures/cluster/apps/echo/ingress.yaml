---
# ${BASE_DOMAIN} comes from the SOPS Secret cluster-settings on the live
# cluster; CI supplies a stand-in (fixtures/supply.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: echo
spec:
  rules:
    - host: echo.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 8080
