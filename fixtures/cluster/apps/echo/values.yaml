# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/values.schema.json
controllers:
  echo:
    containers:
      app:
        image:
          repository: docker.io/library/busybox
          tag: 1.38.0
        command: ["httpd", "-f", "-p", "8081"]
service:
  app:
    controller: echo
    ports:
      http:
        port: 8080
