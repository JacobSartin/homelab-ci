name: Merge Renovate update
description: Merge a validated pull request once GitHub reports it mergeable

inputs:
  github-token:
    description: Token used to merge; a GitHub App token with the workflows permission is required for pull requests that change workflow files
    required: true
  pr-number:
    description: Pull request number to merge
    required: true
  head-sha:
    description: Validated head revision; the merge is abandoned when the pull request moved
    default: ""
  merge-method:
    description: merge, squash or rebase
    default: squash
  retries:
    description: Attempts while GitHub computes mergeability
    default: "12"
  retry-delay-ms:
    description: Delay between attempts
    default: "10000"

outputs:
  outcome:
    description: merged, closed, superseded, conflict, not_ready, workflow_permission or merge_failed
    value: ${{ steps.merge.outputs.outcome }}
  reason:
    description: Human-readable explanation of the outcome
    value: ${{ steps.merge.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Merge pull request
      id: merge
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        MERGE_MODULE: ${{ github.action_path }}/../../src/merge-update.mts
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        RETRIES: ${{ inputs.retries }}
        RETRY_DELAY_MS: ${{ inputs.retry-delay-ms }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { pathToFileURL } = await import('node:url');
          const { default: run } = await import(pathToFileURL(process.env.MERGE_MODULE).href);
          await run({ github, context, core });
