name: Check secrets
description: Require SOPS encryption for every file a creation rule matches, and scan the tree with gitleaks

inputs:
  working-directory:
    description: Repository checkout to check
    default: "."
  sops-version:
    description: SOPS release to install
    default: 3.13.3
  gitleaks-version:
    description: gitleaks release to install
    default: 8.30.1

runs:
  using: composite
  steps:
    - name: Install SOPS and gitleaks
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        # Pin the CLI too: the action otherwise downloads the latest release.
        version: 2026.10.20
        cache: true
        cache_key_prefix: homelab-ci-secrets-v1
        install_args: sops@${{ inputs.sops-version }} gitleaks@${{ inputs.gitleaks-version }}
        tool_versions: |
          sops ${{ inputs.sops-version }}
          gitleaks ${{ inputs.gitleaks-version }}

    - name: Check secrets
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECK_SCRIPT: ${{ github.action_path }}/check.sh
      run: bash "$CHECK_SCRIPT"
